name: Android app

# Builds the RaPS APK from the web app commit pinned in web-app.lock.
# - Pull requests: test APK attached to the run.
# - Push to main / manual run with signing secrets: signed APK, published as a
#   GitHub Release (stable download page for instructors).
# Signing secrets: ANDROID_KEYSTORE_B64, ANDROID_KEYSTORE_PASSWORD,
# ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD. The older TCCC_KEYSTORE_BASE64,
# TCCC_KEYSTORE_PASSWORD, TCCC_KEY_ALIAS, TCCC_KEY_PASSWORD names also work.
# See docs/ANDROID-APP.md.

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 || secrets.TCCC_KEYSTORE_BASE64 }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install Capacitor
        run: npm install --no-audit --no-fund

      - name: Fetch and bundle the pinned web app
        run: npm run web

      - name: Create the Android project
        run: bash scripts/prepare-android.sh

      - name: Build APK
        working-directory: android
        env:
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD || secrets.TCCC_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS || secrets.TCCC_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD || secrets.TCCC_KEY_PASSWORD }}
        run: |
          VNAME=$(node -e "console.log(require('fs').readFileSync('../www/version.js','utf8').match(/versionName: '([^']+)'/)[1])")
          OUT="$GITHUB_WORKSPACE/RaPS-$VNAME"
          echo "VNAME=$VNAME" >> "$GITHUB_ENV"
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/raps.keystore"
            ./gradlew --no-daemon assembleRelease \
              -Pandroid.injected.signing.store.file="$RUNNER_TEMP/raps.keystore" \
              -Pandroid.injected.signing.store.password="$KEYSTORE_PASSWORD" \
              -Pandroid.injected.signing.key.alias="$KEY_ALIAS" \
              -Pandroid.injected.signing.key.password="$KEY_PASSWORD"
            cp app/build/outputs/apk/release/app-release.apk "$OUT.apk"
            rm -f "$RUNNER_TEMP/raps.keystore"
            echo "APK_PATH=$OUT.apk" >> "$GITHUB_ENV"
            echo "SIGNED=true" >> "$GITHUB_ENV"
          else
            ./gradlew --no-daemon assembleDebug
            cp app/build/outputs/apk/debug/app-debug.apk "$OUT-TEST-BUILD.apk"
            echo "APK_PATH=$OUT-TEST-BUILD.apk" >> "$GITHUB_ENV"
            echo "SIGNED=false" >> "$GITHUB_ENV"
            echo "::warning::No signing key configured: this is a TEST BUILD. Installing a later build requires uninstalling, which deletes unsynced records."
          fi
          sha256sum "$GITHUB_WORKSPACE"/RaPS-*.apk

      - name: Check the bundle inside the APK
        run: |
          unzip -l "$APK_PATH" | grep -E "assets/public/(index.html|app.js|vendor/supabase-js)" || { echo "Web app missing from APK"; exit 1; }

      - uses: actions/upload-artifact@v4
        with:
          name: RaPS-${{ env.VNAME }}-android
          path: ${{ env.APK_PATH }}
          retention-days: 30

      - name: Publish signed release
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && env.SIGNED == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="android-v$VNAME"
          WEB=$(cut -c1-7 www/web-commit.txt)
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists; not replacing it."
          else
            gh release create "$TAG" "$APK_PATH" --title "RaPS $VNAME for Android" \
              --notes "Signed Android build of RaPS $VNAME (web app commit $WEB). Install over the previous version; Sync Classes first. See docs/ANDROID-APP.md."
          fi
